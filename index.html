<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrightSmile Dental - AI Frontdesk Assistant</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .avatar {
      font-size: 64px;
      margin-bottom: 1rem;
    }
    h2 {
      color: #1a237e;
      margin: 0 0 0.5rem 0;
    }
    p {
      color: #5c6bc0;
      font-size: 14px;
      margin: 0 0 1.5rem 0;
    }
    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background: #e0e0e0;
      color: #424242;
      margin-bottom: 1.5rem;
    }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-start {
      background: #00c853;
      color: white;
    }
    .btn-start:hover {
      background: #00e676;
    }
    .btn-end {
      background: #d50000;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">🦷</div>
    <h2>Maya - Dental AI Receptionist</h2>
    <p>BrightSmile Dental Practice Manager</p>

    <div id="status" class="status-badge">Ready to Connect</div>

    <button id="call-btn" class="btn btn-start">Start Voice Call</button>
  </div>

  <script type="module">
    // Import Retell Client SDK directly as an ES Module
    import { RetellWebClient } from "https://cdn.jsdelivr.net/npm/retell-client-js-sdk@latest/+esm";

    // 1. Enter your exact credentials
    const AGENT_ID = "agent_198d66808b45681c64653b7092";
    const API_KEY = "key_0117900268a440ed59d36d89d0d1";

    const retellWebClient = new RetellWebClient();
    let isCallActive = false;

    const btn = document.getElementById('call-btn');
    const status = document.getElementById('status');

    // Register Call Event Listeners
    retellWebClient.on("call_started", () => {
      isCallActive = true;
      status.innerText = "● Live Call Active";
      status.style.background = "#e8f5e9";
      status.style.color = "#2e7d32";
      btn.innerText = "End Call";
      btn.className = "btn btn-end";
    });

    retellWebClient.on("call_ended", () => {
      resetUI();
    });

    retellWebClient.on("error", (err) => {
      console.error("Retell Call Error:", err);
      resetUI();
    });

    // Handle Button Click
    btn.addEventListener('click', async () => {
      if (!isCallActive) {
        status.innerText = "Connecting...";
        status.style.background = "#fff9c4";
        status.style.color = "#f57f17";

        try {
          // Fetch Web Call Session Token from Retell API
          const response = await fetch("https://api.retellai.com/v2/create-web-call", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + API_KEY
            },
            body: JSON.stringify({
              agent_id: AGENT_ID
            })
          });

          const data = await response.json();

          if (!response.ok || !data.access_token) {
            throw new Error(data.message || "Failed to generate access token");
          }

          // Start WebCall Audio Stream
          await retellWebClient.startCall({
            accessToken: data.access_token
          });

        } catch (error) {
          console.error("Failed to start web call:", error);
          alert("Error starting call: " + error.message);
          resetUI();
        }
      } else {
        retellWebClient.stopCall();
        resetUI();
      }
    });

    function resetUI() {
      isCallActive = false;
      status.innerText = "Ready to Connect";
      status.style.background = "#e0e0e0";
      status.style.color = "#424242";
      btn.innerText = "Start Voice Call";
      btn.className = "btn btn-start";
    }
  </script>
</body>
</html>
